name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security:
    name: Offline security controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Lint offline Python and shell tooling
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        run: make -C exploits/tiz0wn-root lint
      - name: Verify synthetic security boundaries
        run: python3 .github/scripts/security_checks.py
